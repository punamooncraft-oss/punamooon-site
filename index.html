<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>puna.moon</title>
  <meta name="description" content="山の稜線、凪の海、心象風景。自然の景色を身につけて。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@200;300&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0e0e0c;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      font-family: 'Jost', sans-serif;
    }

    .hero {
      width: 100%;
      max-width: 480px;
      position: relative;
      aspect-ratio: 4/5;
      overflow: hidden;
    }

    .hero img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
      filter: brightness(0.92);
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to bottom,
        transparent 40%,
        rgba(14,14,12,0.6) 75%,
        rgba(14,14,12,1) 100%
      );
    }

    .content {
      width: 100%;
      max-width: 480px;
      padding: 0 2rem 3rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
      margin-top: -3rem;
      position: relative;
      z-index: 2;
    }

    .brand { text-align: center; }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 2.4rem;
      color: #f0ede8;
      letter-spacing: 0.15em;
      line-height: 1;
    }

    .brand-dot { color: #a8a090; }

    .brand-sub {
      font-size: 10px;
      letter-spacing: 0.4em;
      color: #6a6860;
      font-weight: 200;
      margin-top: 0.5rem;
      text-transform: uppercase;
    }

    .divider {
      width: 32px;
      height: 0.5px;
      background: #3a3830;
    }

    .links {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .link-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.4rem;
      border: 0.5px solid #2e2d2a;
      text-decoration: none;
      color: #c8c4bc;
      font-size: 11px;
      letter-spacing: 0.3em;
      font-weight: 300;
      text-transform: uppercase;
      transition: all 0.25s ease;
      background: rgba(255,255,255,0.02);
    }

    .link-btn:hover {
      border-color: #5a5850;
      color: #f0ede8;
      background: rgba(255,255,255,0.05);
    }

    .link-note {
      margin-left: 0.9em;
      font-size: 9px;
      letter-spacing: 0.15em;
      color: #6a6860;
      text-transform: none;
    }

    .lang {
      position: absolute; top: 1rem; right: 1rem; z-index: 5;
      display: flex; gap: 0.15rem;
      background: rgba(14,14,12,0.45); padding: 0.25rem 0.35rem;
    }
    .lang button {
      background: none; border: none; cursor: pointer; font-family: inherit;
      font-size: 9px; letter-spacing: 0.12em; color: #8a8680; padding: 0.15rem 0.3rem;
    }
    .lang button:hover { color: #f0ede8; }
    .lang button.on { color: #f0ede8; border-bottom: 0.5px solid #a8a090; }
    .intl-note {
      margin-top: 0.6rem; font-size: 10px; line-height: 1.9; letter-spacing: 0.08em;
      color: #8a8680; font-weight: 300;
    }
    .intl-note[hidden] { display: none; }
    body:lang(zh-Hant) { font-family: 'Jost', 'PingFang TC', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif; }

    .link-arrow {
      font-size: 12px;
      color: #3a3830;
      transition: all 0.25s ease;
    }

    .link-btn:hover .link-arrow {
      color: #a8a090;
      transform: translateX(3px);
    }

    .footer {
      font-size: 9px;
      letter-spacing: 0.3em;
      color: #2e2d2a;
      text-transform: uppercase;
      font-weight: 200;
    }

    .fade-in {
      opacity: 0;
      transform: translateY(12px);
      animation: fadeUp 0.8s ease forwards;
    }
    .fade-in:nth-child(1) { animation-delay: 0.1s; }
    .fade-in:nth-child(2) { animation-delay: 0.25s; }
    .fade-in:nth-child(3) { animation-delay: 0.4s; }
    .fade-in:nth-child(4) { animation-delay: 0.55s; }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="hero">
    <img src="kasane_main_01.JPG" alt="puna.moon — 山の稜線リング">
    <div class="hero-overlay"></div>
    <div class="lang" id="langSwitch" aria-label="Language"></div>
  </div>

  <div class="content">
    <div class="brand fade-in">
      <div class="brand-name">puna<span class="brand-dot">.</span>moon</div>
      <div class="brand-sub">handcrafted jewelry</div>
    </div>

    <div class="divider fade-in"></div>

    <div class="links fade-in">
      <a class="link-btn" href="https://www.instagram.com/puna.moon/" target="_blank" rel="noopener">
        <span>Instagram</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-btn" href="https://punamoon.base.shop" target="_blank" rel="noopener">
        <span>Online Shop</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-btn" href="./puna.moon_catalog_compressed.pdf" target="_blank" rel="noopener">
        <span>Online Catalog<span class="link-note" data-i18n="catalogNote">2026.6時点</span></span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-btn" href="./stockists.html">
        <span>Stockists</span>
        <span class="link-arrow">→</span>
      </a>
      <a class="link-btn" href="mailto:puna.moon.craft@gmail.com">
        <span>E-mail</span>
        <span class="link-arrow">→</span>
      </a>
      <p class="intl-note" id="intlNote" hidden></p>
    </div>

    <div class="footer fade-in">© puna.moon</div>
  </div>

<script>
/* 多言語（日本語・English・繁體中文）。取扱店マップと同じ保存先（punamoon.lang）を使う */
(() => {
  const LANGS = { ja: '日本語', en: 'EN', zh: '繁中' };
  const HTML_LANG = { ja: 'ja', en: 'en', zh: 'zh-Hant' };
  const q = new URLSearchParams(location.search).get('lang');
  let lang = null;
  if (q && LANGS[q]) { lang = q; try { localStorage.setItem('punamoon.lang', q); } catch {} }
  if (!lang) { try { const v = localStorage.getItem('punamoon.lang'); if (v && LANGS[v]) lang = v; } catch {} }
  if (!lang) {
    const nav = (navigator.languages || [navigator.language || 'ja']).map(x => x.toLowerCase());
    lang = 'en';
    for (const l of nav) { if (l.startsWith('ja')) { lang = 'ja'; break; } if (l.startsWith('zh')) { lang = 'zh'; break; } if (l.startsWith('en')) { lang = 'en'; break; } }
  }
  document.documentElement.lang = HTML_LANG[lang];
  const T = {
    catalogNote: { ja: '2026.6時点', en: 'Jun 2026 · Japanese', zh: '2026年6月版・日文' },
    intlNote: { en: 'We ship overseas. Order on the Online Shop (BASE), or contact us by Instagram DM or e-mail.',
                zh: '提供海外寄送。請於 Online Shop（BASE）下單，或透過 Instagram 私訊、電子郵件與我們聯繫。' },
  };
  document.querySelectorAll('[data-i18n]').forEach(el => { const v = T[el.dataset.i18n][lang]; if (v) el.textContent = v; });
  const note = document.getElementById('intlNote');
  if (T.intlNote[lang]) { note.textContent = T.intlNote[lang]; note.hidden = false; }
  const sw = document.getElementById('langSwitch');
  sw.innerHTML = Object.entries(LANGS).map(([k, v]) => `<button type="button" data-lang="${k}" class="${k === lang ? 'on' : ''}" lang="${HTML_LANG[k]}">${v}</button>`).join('');
  sw.addEventListener('click', e => {
    const b = e.target.closest('button[data-lang]'); if (!b || b.dataset.lang === lang) return;
    try { localStorage.setItem('punamoon.lang', b.dataset.lang); } catch {}
    const u = new URL(location.href); u.searchParams.delete('lang'); location.href = u.toString();
  });
})();
</script>
</body>
</html>
